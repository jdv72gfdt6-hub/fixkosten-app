<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fixkosten" />
    <meta name="description" content="Fixkosten und Konten im Blick – alle Daten bleiben auf dem Gerät." />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Fixkosten</title>
    <script>
      // Gespeichertes Design vor dem ersten Zeichnen setzen (kein Aufblitzen).
      try {
        var t = localStorage.getItem('design');
        if (t === 'hell') document.documentElement.dataset.theme = 'light';
        if (t === 'dunkel') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
